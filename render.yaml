
services:
  - type: web
    name: burmese-auto-recap-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: MAX_UPLOAD_SIZE
        value: "1073741824"

      - key: MAX_VIDEO_DURATION
        value: "21000"
